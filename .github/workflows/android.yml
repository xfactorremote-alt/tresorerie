# Construit l'APK gratuitement sur GitHub à chaque envoi de code.
# L'APK se télécharge ensuite dans l'onglet Actions > dernière exécution > Artifacts.
name: APK Android
on:
  push:
    branches: [tresorerie-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Renseigner l'adresse Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          F=composeApp/src/commonMain/kotlin/org/jpgrenoble/tresorerie/Config.kt
          if [ -n "$SUPABASE_URL" ]; then
            sed -i "s|https://VOTRE-PROJET.supabase.co|$SUPABASE_URL|; s|VOTRE_CLE_ANON|$SUPABASE_ANON_KEY|" "$F"
          fi
      - name: Construire l'APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :composeApp:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
      - name: Publier le journal en cas d'échec
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/log && cd /tmp/log
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 /tmp/build.log | head -300 > erreurs.txt || true
          tail -200 /tmp/build.log > fin.txt
          git init -q -b tresorerie-apk-log
          git -c user.name=ci -c user.email=ci@local add . && git -c user.name=ci -c user.email=ci@local commit -qm "Journal ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tresorerie-apk-log
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tresorerie-apk
          path: android/composeApp/build/outputs/apk/debug/*.apk
      - name: Publier l'APK sur la branche tresorerie-apk-binaire
        run: |
          mkdir -p /tmp/out && cp composeApp/build/outputs/apk/debug/*.apk /tmp/out/tresorerie-jp.apk
          cd /tmp/out && git init -q -b tresorerie-apk-binaire
          git -c user.name=ci -c user.email=ci@local add . && git -c user.name=ci -c user.email=ci@local commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tresorerie-apk-binaire
